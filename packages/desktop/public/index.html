<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>memgrant · 授权</title>
<style>
  :root {
    --bg: #fafaf8; --surface: #ffffff; --border: #e4e2da;
    --text: #2c2c2a; --muted: #888780; --accent: #0f6e56;
    --accent-bg: #e1f5ee; --danger: #a32d2d; --danger-bg: #fcebeb;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: baseline; gap: 12px; }
  header h1 { font-size: 16px; font-weight: 500; }
  header .badge { font-size: 12px; color: var(--muted); }
  nav { display: flex; gap: 4px; padding: 10px 24px 0; }
  nav button { border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 6px 16px; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 13px; }
  nav button.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 500; }
  main { padding: 20px 24px; }
  .panel { display: none; }
  .panel.active { display: block; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  .lv { display: inline-block; min-width: 28px; text-align: center; border-radius: 6px; font-size: 12px; padding: 1px 6px; background: var(--accent-bg); color: var(--accent); }
  .lv.sensitive { background: var(--danger-bg); color: var(--danger); }
  .btn { border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
  .btn.danger { color: var(--danger); border-color: var(--danger); }
  .btn.primary { color: var(--accent); border-color: var(--accent); }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
  .toolbar input { flex: 1; max-width: 320px; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; max-width: 560px; }
  .card dt { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .card dd { font-size: 14px; }
  .muted { color: var(--muted); font-size: 12px; }
  select { border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; }
  .hint { max-width: 640px; margin-bottom: 16px; padding: 12px 14px; background: var(--accent-bg); border-radius: 8px; font-size: 13px; }
  .hint strong { font-weight: 600; }
  .add { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .add input { border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 13px; width: 180px; }
  .empty { color: var(--muted); padding: 24px 8px; }
</style>
</head>
<body>
<header>
  <h1>memgrant</h1>
  <span class="badge" id="keyBadge">加载中…</span>
</header>
<nav>
  <button data-tab="agents" class="active">Agent 授权</button>
  <button data-tab="memories">记忆</button>
  <button data-tab="keys">密钥</button>
  <button data-tab="audit">审计</button>
</nav>
<main>
  <section id="agents" class="panel active">
    <p class="hint">每个 Agent 只能解开你授权的级别。掩码是最高可读级别：L2 读不了 L4。撤销会删除云端 grant，此后新拉取的密文不可解。本机已缓存的明文无法远程擦除。</p>
    <div class="add">
      <input id="newAgentId" placeholder="Agent ID，如 gemini-cli" maxlength="64">
      <select id="newAgentMask">
        <option value="1">L1 公开</option>
        <option value="2" selected>L2 偏好</option>
        <option value="3">L3 工作</option>
        <option value="4">L4 敏感</option>
      </select>
      <button class="btn primary" onclick="addAgent()">添加 Agent</button>
    </div>
    <table><thead><tr><th>Agent</th><th>最高可读级别</th><th>状态</th><th>操作</th></tr></thead><tbody id="agentBody"></tbody></table>
    <p class="muted" id="agentHint">init 会预置 cursor（MCP）与 claude-code（Hooks）。改掩码或撤销会打到同步节点并重算 grant。</p>
  </section>
  <section id="memories" class="panel">
    <div class="toolbar">
      <input id="q" placeholder="搜索记忆…" onkeydown="if(event.key==='Enter')loadMemories()">
      <button class="btn primary" onclick="loadMemories()">搜索</button>
      <button class="btn" onclick="pullSync()">从云端拉同步</button>
    </div>
    <table><thead><tr><th>内容</th><th>类型</th><th>级别</th><th>来源</th><th>更新时间</th><th></th></tr></thead><tbody id="memBody"></tbody></table>
    <p class="muted" id="memCount"></p>
  </section>
  <section id="keys" class="panel">
    <dl class="card" id="keyCard"></dl>
    <p class="muted">主密钥存于平台安全存储（Keychain/DPAPI/libsecret），此页面不显示任何密钥材料。</p>
  </section>
  <section id="audit" class="panel">
    <table><thead><tr><th>时间</th><th>动作</th><th>详情</th></tr></thead><tbody id="auditBody"></tbody></table>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => {
  document.querySelectorAll("nav button").forEach((x) => x.classList.toggle("active", x === b));
  document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("active", p.id === b.dataset.tab));
  if (b.dataset.tab === "agents") loadAgents();
  if (b.dataset.tab === "memories") loadMemories();
  if (b.dataset.tab === "audit") loadAudit();
  if (b.dataset.tab === "keys") loadKeys();
});
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function loadMemories() {
  const q = $("q").value.trim();
  const r = await (await fetch("/api/memories" + (q ? "?q=" + encodeURIComponent(q) : ""))).json();
  $("memBody").innerHTML = (r.items ?? []).map((m) => `
    <tr>
      <td>${esc(m.plaintext.length > 60 ? m.plaintext.slice(0, 60) + "…" : m.plaintext)}</td>
      <td>${esc(m.type)}</td>
      <td><span class="lv ${m.permissionLevel >= 3 ? "sensitive" : ""}">L${m.permissionLevel}</span></td>
      <td>${esc(m.sourceAgent ?? "—")}</td>
      <td>${esc((m.updatedAt ?? "").slice(0, 16).replace("T", " "))}</td>
      <td><button class="btn danger" onclick="delMemory('${esc(m.memoryId)}')">删除</button></td>
    </tr>`).join("");
  $("memCount").textContent = `共 ${r.total} 条`;
}
async function pullSync() {
  const r = await fetch("/api/sync/pull", { method: "POST" });
  const body = await r.json();
  if (!r.ok) {
    alert(body.error ?? "同步失败");
    return;
  }
  await loadMemories();
  alert(`已拉取：写入 ${body.applied ?? 0}，删除 ${body.deleted ?? 0}`);
}
async function delMemory(id) {
  if (!confirm("删除后云端密文与全部授权凭据一并销毁，确认？")) return;
  await fetch("/api/memories/" + encodeURIComponent(id), { method: "DELETE" });
  loadMemories();
}

async function loadAgents() {
  const r = await (await fetch("/api/agents")).json();
  const items = r.items ?? [];
  if (items.length === 0) {
    $("agentBody").innerHTML = `<tr><td colspan="4" class="empty">还没有 Agent。添加一个 ID，写入时会为它生成 ECIES grant。</td></tr>`;
    return;
  }
  $("agentBody").innerHTML = items.map((a) => `
    <tr>
      <td>${esc(a.agentId)}</td>
      <td><select onchange="setMask('${esc(a.agentId)}', this.value)" ${a.status !== "active" ? "disabled" : ""}>
        ${[0,1,2,3,4].map((l) => `<option value="${l}" ${l === a.permissionMask ? "selected" : ""}>L${l}</option>`).join("")}
      </select></td>
      <td>${a.status === "active" ? "可解密授权范围" : "已撤销（新密文不可解）"}</td>
      <td>${a.status === "active" ? `<button class="btn danger" onclick="revoke('${esc(a.agentId)}')">撤销授权</button>` : "—"}</td>
    </tr>`).join("");
}
async function addAgent() {
  const agentId = $("newAgentId").value.trim();
  const permissionMask = Number($("newAgentMask").value);
  if (!agentId) {
    alert("请填写 Agent ID");
    return;
  }
  const r = await fetch("/api/agents", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ agentId, permissionMask }),
  });
  const body = await r.json();
  if (!r.ok) {
    alert(body.error ?? "添加失败");
    return;
  }
  $("newAgentId").value = "";
  loadAgents();
}
async function setMask(id, mask) {
  await fetch(`/api/agents/${encodeURIComponent(id)}/mask`, {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ mask: Number(mask) }),
  });
  loadAgents();
}
async function revoke(id) {
  if (!confirm(`撤销 ${id}？其全部授权凭据将被删除，此后无法解密任何新拉取的记忆。`)) return;
  await fetch(`/api/agents/${encodeURIComponent(id)}/revoke`, { method: "POST" });
  loadAgents();
}

async function loadKeys() {
  const r = await (await fetch("/api/key-status")).json();
  $("keyCard").innerHTML = `
    <dt>安全存储后端</dt><dd>${esc(r.backend)}</dd>
    <dt>主密钥状态</dt><dd>${r.initialized ? "已初始化" : "未初始化（需先运行 setup/恢复）"}</dd>
    <dt>本机 Agent 身份</dt><dd>${esc(r.agentId ?? "—")}</dd>
    <dt>云端端点</dt><dd>${esc(r.endpoint ?? "—")}</dd>
    <dt>判断引擎</dt><dd>${esc(r.judge?.engine ?? "l0")}${r.judge?.model ? " · " + esc(r.judge.model) : ""}</dd>`;
  $("keyBadge").textContent = `${r.backend} · ${r.initialized ? "密钥就绪" : "未初始化"}`;
}

async function loadAudit() {
  const r = await (await fetch("/api/audit")).json();
  $("auditBody").innerHTML = (r.items ?? []).map((a) => `
    <tr><td>${esc(a.ts.slice(0, 19).replace("T", " "))}</td><td>${esc(a.action)}</td><td>${esc(JSON.stringify(a.detail))}</td></tr>`).join("");
}

loadAgents(); loadKeys();
</script>
</body>
</html>
